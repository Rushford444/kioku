name: dist

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every published asset is built on its own runner: the target triple,
        # not uname, decides the archive name that package.sh writes.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Remap build paths (no runner paths in shipped binaries)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=--remap-path-prefix=$HOME=/build --remap-path-prefix=$GITHUB_WORKSPACE=/src" >> "$GITHUB_ENV"
      - name: Build and verify archive
        shell: bash
        run: scripts/package.sh dist "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kioku-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate tag, main ancestry and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{}")"
          git merge-base --is-ancestor HEAD FETCH_HEAD
          python3 -c 'import pathlib,re,sys,tomllib; tag=sys.argv[1]; version=tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]; assert tag == "v"+version, "tag does not match Cargo version"; text=pathlib.Path("CHANGELOG.md").read_text(); sections=re.split(r"(?m)^## ",text); matches=[s for s in sections if re.match(r"\["+re.escape(version)+r"\](?: - [^\n]+)?\n",s)]; assert len(matches)==1, "missing or duplicate release notes"; body=matches[0].split("\n",1)[1]; body=re.split(r"(?m)^\[(?:Unreleased|[0-9])[^\n]*\]: ",body)[0].rstrip(); assert body.strip(), "empty release notes"; pathlib.Path("release-notes.md").write_text(body+"\n")' "$TAG"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: kioku-*
          path: artifacts
      - name: Verify checksums and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-assets
          for dir in artifacts/kioku-*; do
            (cd "$dir" && sha256sum -c SHA256SUMS)
            cat "$dir/SHA256SUMS" >> release-assets/SHA256SUMS
            find "$dir" -maxdepth 1 -type f ! -name SHA256SUMS -exec cp {} release-assets/ \;
          done
          test "$(find release-assets -type f ! -name SHA256SUMS | wc -l)" -eq 5
          gh release create "$TAG" release-assets/* --title "$TAG" --notes-file release-notes.md --verify-tag
