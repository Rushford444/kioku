[package]
name = "kdw-kioku"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "Conservative command exit-status reuse with opt-in tracing"
repository = "https://github.com/Rushford444/kioku"
homepage = "https://kodawaristudio.fr"
authors = ["Kodawari <contact@kodawaristudio.fr>"]
license = "MIT"
publish = false
include = [
    "/src/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE",
    "/README.md", "/README.fr.md", "/CHANGELOG.md",
    "/CONTRIBUTING.md", "/SECURITY.md", "/docs/usage.md",
    "/docs/configuration.md", "/docs/fr/usage.md",
    "/docs/fr/configuration.md", "/docs/REPLAY-V03.md",
    "/docs/demo-session.txt", "/docs/assets/banner-light.jpg",
    "/docs/assets/banner-dark.jpg", "/docs/AGENTS-KIOKU.md",
]
keywords = ["cache", "fingerprint", "content-addressed", "build"]
categories = ["development-tools", "caching"]

[lib]
name = "kioku"
path = "src/lib.rs"

[[bin]]
name = "kioku"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
fs4 = "0.13"
globset = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
thiserror = "2"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
assert_cmd = "2"
proptest = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
